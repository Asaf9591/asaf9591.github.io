<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" style="background:#0f1117; border-radius:8px;">
  <!-- Definiciones de Estilos y Filtros -->
  <defs>
    <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#2ecc71" />
    </linearGradient>
  </defs>

  <!-- Isotipo: Geometría de Vértice / Vórtice -->
  <g transform="translate(15, 15)">
    <!-- Marco Hexagonal / Escudo Tecnológico -->
    <polygon points="45,5 85,27 85,63 45,85 5,63 5,27" fill="none" stroke="#262b3a" stroke-width="2"/>
    <!-- V entrelazada con efecto cinético -->
    <path d="M 20,20 L 45,70 L 70,20" fill="none" stroke="url(#vortexGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 32,25 L 45,50 L 58,25" fill="none" stroke="#e6e8ef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Nodo central de escaneo -->
    <circle cx="45" cy="50" r="3" fill="#2ecc71"/>
  </g>

  <!-- Tipografía del Logotipo -->
  <text x="110" y="58" font-family="-apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#e6e8ef" letter-spacing="5">VORTEX</text>
  <text x="112" y="84" font-family="-apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#8b90a3" letter-spacing="3.5">LOCAL &bull; FAST &bull; ACTIONABLE</text>
</svg>
